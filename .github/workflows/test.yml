# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macOS-latest, ubuntu-latest]
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 2
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Check File Changes
      id: check-changes
      shell: bash
      run: |
        echo "skip=1" >> $GITHUB_OUTPUT
        mkdir -p /tmp/check_changes
        git diff --name-only HEAD^..HEAD ':!docs' | while read i
        do
          echo "Checking for changes: $i"
          if ! git show HEAD^:$i > /tmp/check_changes/$(basename $i)
          then
            echo "New file found, or 'git show' failed, running tests."
          elif ! python ./compare_sources.py $i /tmp/check_changes/$(basename $i)
          then
            echo "Change found, running tests."
          else
            continue
          fi

          echo "skip=0" >> $GITHUB_OUTPUT
          break
        done
    - name: Install dependencies
      shell: bash
      if: steps.check-changes.outputs.skip == 0
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      shell: bash
      if: steps.check-changes.outputs.skip == 0
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
