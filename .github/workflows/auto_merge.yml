name: Auto-Update PR Branch

on: workflow_dispatch
  # push:
  #   branches:
  #     - main # Change to your primary target branch (e.g., master, develop)

permissions:
  contents: write
  pull-requests: write

jobs:
  update-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      - name: Update out-of-date pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find all open PRs targeting this branch
          prs=$(gh pr list  --base ${{ github.ref_name }} --json number,headRefName)
          
          echo "$prs" | jq -c '.[]' | while read -r pr; do
            pr_number=$(echo "$pr" | jq -r '.number')
            head_branch=$(echo "$pr" | jq -r '.headRefName')
            
            echo "Attempting to update PR #$pr_number ($head_branch)..."
            
            # Use GitHub CLI to merge the target branch into the PR branch
            gh pr update-branch "$pr_number" || echo "Skipping PR #$pr_number due to merge conflicts."
          done
