
name: pre-commit-ci

on:
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VER1: "3.12"

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python {{ $PYTHON_VER1 }}
      uses: actions/setup-python@v6
      with:
        python-version: $PYTHON_VER1
        cache: pip
    - name: Autofix
      shell: bash
      run: bash runtests.sh --autofix
    - uses: pre-commit/action@v3.0.1
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()
