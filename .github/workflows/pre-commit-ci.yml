
name: pre-commit-ci

on:
  pull_request:
    branches: [main, dev]

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Autofix
      shell: bash
      run: bash runtests.sh --autofix
    - uses: pre-commit-ci/lite-action@v1.1.0
      if: always()